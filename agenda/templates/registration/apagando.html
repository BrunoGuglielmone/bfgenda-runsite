{% load static %}

<!DOCTYPE html>
<html
    lang="es"
    data-theme-preference="{{ tema_interfaz_preferencia|default:'sistema' }}"
    data-theme-authenticated="{{ request.user.is_authenticated|yesno:'true,false' }}"
>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="BFGenda se está deteniendo.">

    <title>Deteniendo BFGenda</title>

    <meta name="theme-color" content="#E7DFF7">
    <meta name="color-scheme" content="light dark">
    <link rel="stylesheet" href="{% static 'agenda/css/theme.css' %}?v=20261105-1">
    <script src="{% static 'agenda/js/theme.js' %}?v=20261105-1"></script>
    <meta name="application-name" content="BFGenda">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="black-translucent"
    >

    <link
        rel="manifest"
        href="{% url 'pwa_manifest' %}"
    >

    <link
        rel="icon"
        type="image/png"
        sizes="32x32"
        href="{% static 'agenda/img/branding/favicon-32x32.png' %}"
    >
    <link
        rel="icon"
        type="image/png"
        sizes="16x16"
        href="{% static 'agenda/img/branding/favicon-16x16.png' %}"
    >
    <link
        rel="apple-touch-icon"
        href="{% static 'agenda/img/branding/apple-touch-icon.png' %}"
    >

    <link
        rel="stylesheet"
        href="{% static 'agenda/css/login.css' %}?v=20261106-2"
    >
</head>
<body>
    <main class="login-page shutdown-page">
        <section
            class="login-card shutdown-status-card"
            data-shutdown-status
            data-status-url="{% url 'agenda:estado_agende' %}"
            aria-live="polite"
        >
            <div class="shutdown-status-icon" aria-hidden="true">
                <span class="shutdown-spinner"></span>
                <span class="shutdown-success-mark">✓</span>
            </div>

            <h1 data-shutdown-title>
                BFGenda se está deteniendo
            </h1>

            <p data-shutdown-description>
                El servidor se apagará en unos segundos. Esta pantalla te
                confirmará automáticamente cuando haya finalizado.
            </p>

            <div
                class="shutdown-status-note"
                data-shutdown-note
            >
                Para volver a utilizar la aplicación, abre nuevamente el acceso
                directo <strong>BFGenda</strong> del Escritorio.
            </div>
        </section>
    </main>

    <script
        src="{% static 'agenda/js/apagado.js' %}?v=20260731-2"
        defer
    ></script>

    <script
        src="{% static 'agenda/js/pwa.js' %}?v=20260729-1"
        defer
    ></script>
</body>
</html>
