{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >
    <meta name="robots" content="noindex, nofollow">
    <title>BFGenda en mantenimiento</title>

    <link
        rel="icon"
        type="image/png"
        sizes="32x32"
        href="{% static 'agenda/img/branding/bfgenda-simbolo-xl-64.png' %}"
    >

    <style>
        :root {
            color-scheme: dark;
            font-family:
                Inter, system-ui, -apple-system, BlinkMacSystemFont,
                "Segoe UI", sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            background:
                radial-gradient(
                    circle at top,
                    #312960 0,
                    #171526 48%,
                    #0e0d17 100%
                );
            color: #f7f5ff;
        }

        main {
            width: min(100%, 520px);
            padding: 36px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 28px;
            background: rgba(26, 23, 44, 0.92);
            box-shadow: 0 24px 70px rgba(0, 0, 0, 0.35);
        }

        img {
            width: 92px;
            height: 92px;
            object-fit: contain;
            margin-bottom: 14px;
        }

        h1 {
            margin: 0 0 12px;
            font-size: clamp(1.7rem, 5vw, 2.25rem);
        }

        p {
            margin: 0;
            color: #c8c3dc;
            line-height: 1.65;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            margin-top: 24px;
            padding: 10px 15px;
            border-radius: 999px;
            background: rgba(125, 101, 255, 0.14);
            color: #ded8ff;
            font-size: 0.92rem;
        }

        .dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #56e1d1;
            box-shadow: 0 0 14px #56e1d1;
        }
    </style>
</head>
<body>
    <main>
        <img
            src="{% static 'agenda/img/branding/bfgenda-simbolo-xl-128.png' %}"
            alt="BFGenda"
        >

        <h1>BFGenda se est? actualizando</h1>

        <p>
            Se est? restaurando una copia de seguridad.
            La agenda volver? a estar disponible autom?ticamente
            cuando termine el proceso.
        </p>

        <div class="status">
            <span class="dot" aria-hidden="true"></span>
            Protecci?n temporal de los datos
        </div>
    </main>
</body>
</html>
