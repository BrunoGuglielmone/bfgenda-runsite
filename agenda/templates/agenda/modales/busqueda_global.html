<div
    class="global-search-shell modal-search-shell"
    data-search-shell
    data-search-endpoint="{{ url_busqueda }}"
    data-search-mode="modal"
>
    <header class="global-search-header">
        <span class="global-search-header-icon" aria-hidden="true">⌕</span>
        <div>
            <p>Búsqueda global</p>
            <h2 id="app-modal-title">Buscar en BFGenda</h2>
            <span>Encuentra tareas, eventos y categorías desde un solo lugar.</span>
        </div>
    </header>

    <form
        class="global-search-form"
        method="get"
        action="{{ url_busqueda }}"
        data-live-search-form
        role="search"
    >
        <label class="search-input-wrapper">
            <span aria-hidden="true">⌕</span>
            <input
                type="search"
                name="q"
                value="{{ consulta }}"
                placeholder="Ejemplo: reunión, planificación o trabajo"
                autocomplete="off"
                maxlength="120"
                autofocus
                data-global-search-input
                aria-label="Buscar en BFGenda"
            >
            <kbd>Esc</kbd>
        </label>

        <input type="hidden" name="tipo" value="{{ tipo_busqueda }}" data-search-type-input>
    </form>

    <div class="search-type-filters" aria-label="Filtrar resultados por tipo">
        {% for valor, etiqueta in tipos_busqueda %}
            <button
                class="search-type-filter{% if tipo_busqueda == valor %} active{% endif %}"
                type="button"
                data-search-type="{{ valor }}"
                aria-pressed="{% if tipo_busqueda == valor %}true{% else %}false{% endif %}"
            >
                {{ etiqueta }}
            </button>
        {% endfor %}
    </div>

    {% include "agenda/componentes/resultados_busqueda.html" %}
</div>
