{% load static %}
<!DOCTYPE html>
<html
    lang="es"
    data-theme-preference="{{ tema_interfaz_preferencia|default:'sistema' }}"
    data-theme-authenticated="false"
>
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >
    <meta name="theme-color" content="#E7DFF7">
    <meta name="color-scheme" content="light dark">

    <title>Sin conexi&oacute;n | BFGenda</title>

    <link
        rel="icon"
        type="image/png"
        href="{% static 'agenda/img/branding/bfgenda-simbolo-xl-64.png' %}"
    >
    <link rel="stylesheet" href="{% static 'agenda/css/theme.css' %}?v=20261105-1">
    <script src="{% static 'agenda/js/theme.js' %}?v=20261105-1"></script>

    <style>
        :root {
            font-family:
                Inter, system-ui, -apple-system, BlinkMacSystemFont,
                "Segoe UI", sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            background:
                radial-gradient(
                    circle at top,
                    var(--primary-soft) 0,
                    var(--background) 58%
                );
            color: var(--text);
        }

        main {
            width: min(100%, 480px);
            padding: 36px;
            text-align: center;
            border: 1px solid var(--border);
            border-radius: 28px;
            background: var(--surface-glass-strong);
            box-shadow: var(--shadow-elevated);
        }

        img {
            width: 104px;
            height: 104px;
            object-fit: contain;
            margin-bottom: 16px;
        }

        h1 {
            margin: 0 0 12px;
            font-size: clamp(1.7rem, 5vw, 2.2rem);
        }

        p {
            margin: 0;
            color: var(--text-secondary);
            line-height: 1.65;
        }

        button {
            margin-top: 24px;
            padding: 12px 18px;
            border: 0;
            border-radius: 14px;
            background: var(--primary);
            color: #ffffff;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <main>
        <img
            src="{% static 'agenda/img/branding/bfgenda-simbolo-xl-192.png' %}"
            alt="BFGenda"
        >

        <h1>Sin conexi&oacute;n</h1>

        <p>
            BFGenda no puede comunicarse con el servidor en este momento.
            Comprueba la conexi&oacute;n a Internet y vuelve a intentarlo.
        </p>

        <button type="button" onclick="window.location.reload()">
            Volver a intentar
        </button>
    </main>
</body>
</html>
