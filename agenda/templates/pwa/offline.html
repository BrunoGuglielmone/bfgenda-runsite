{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >
    <meta name="theme-color" content="#6657d9">

    <title>Sin conexi&oacute;n | BFGenda</title>

    <link
        rel="icon"
        type="image/png"
        href="{% static 'agenda/img/branding/bfgenda-simbolo-xl-64.png' %}"
    >

    <style>
        :root {
            font-family:
                Inter, system-ui, -apple-system, BlinkMacSystemFont,
                "Segoe UI", sans-serif;
            color-scheme: dark;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            background:
                radial-gradient(
                    circle at top,
                    #342c69 0,
                    #171526 52%,
                    #0d0c15 100%
                );
            color: #f7f5ff;
        }

        main {
            width: min(100%, 480px);
            padding: 36px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 28px;
            background: rgba(26, 23, 44, 0.94);
            box-shadow: 0 24px 70px rgba(0, 0, 0, 0.35);
        }

        img {
            width: 104px;
            height: 104px;
            object-fit: contain;
            margin-bottom: 16px;
        }

        h1 {
            margin: 0 0 12px;
            font-size: clamp(1.7rem, 5vw, 2.2rem);
        }

        p {
            margin: 0;
            color: #c8c3dc;
            line-height: 1.65;
        }

        button {
            margin-top: 24px;
            padding: 12px 18px;
            border: 0;
            border-radius: 14px;
            background: #6657d9;
            color: #ffffff;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <main>
        <img
            src="{% static 'agenda/img/branding/bfgenda-simbolo-xl-192.png' %}"
            alt="BFGenda"
        >

        <h1>Sin conexi&oacute;n</h1>

        <p>
            BFGenda no puede comunicarse con tu PC en este momento.
            Verifica que la computadora, BFGenda y Tailscale est&eacute;n
            encendidos.
        </p>

        <button type="button" onclick="window.location.reload()">
            Volver a intentar
        </button>
    </main>
</body>
</html>
